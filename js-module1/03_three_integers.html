<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>03 Three Integer Calculator</title>
</head>
<body>
  <script>
    const a = Number(prompt('Enter the first number:'));
    const b = Number(prompt('Enter the second number:'));
    const c = Number(prompt('Enter the third number:'));

    const sum = a + b + c;
    const product = a * b * c;
    const average = sum / 3;

    document.write('<h1>Results</h1>');
    document.write('<p>Sum: ' + sum + '</p>');
    document.write('<p>Product: ' + product + '</p>');
    document.write('<p>Average: ' + average + '</p>');
  </script>
</body>
</html>
