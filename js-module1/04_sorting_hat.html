<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>04 Sorting Hat</title>
</head>
<body>
  <script>
    const studentName = prompt('Enter student name:');
    const roll = Math.floor(Math.random() * 4) + 1;

    let house;
    switch (roll) {
      case 1: house = 'Gryffindor'; break;
      case 2: house = 'Slytherin';  break;
      case 3: house = 'Hufflepuff'; break;
      case 4: house = 'Ravenclaw';  break;
    }

    document.write('<h1>' + studentName + ', you are ' + house + '.</h1>');
  </script>
</body>
</html>
